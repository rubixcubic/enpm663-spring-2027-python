[project]
name = "enpm663-spring-2027-python"
version = "0.1.0"
description = "ENPM663 Spring 2027: the lecture scripts that run without ROS 2"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "PyYAML==6.0.1",
    "py_trees==2.6.0",
    "jsonschema==4.10.3",
    "unified-planning==1.3.0",
    "up-fast-downward==1.0.0",
    "google-genai==2.31.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tools"]
